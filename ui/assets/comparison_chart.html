<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantSim — Strategy Comparison</title>
    <script src="lightweight-charts.standalone.production.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0F1012;
            color: #F3F4F6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        #toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background-color: #0F1012;
            border-bottom: 1px solid #232530;
            flex-shrink: 0;
        }

        .title-badge {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #8A8F98;
            text-transform: uppercase;
        }

        .button-group {
            display: flex;
            align-items: center;
            gap: 4px;
            background-color: #16181D;
            padding: 3px;
            border-radius: 6px;
            border: 1px solid #232530;
        }

        .btn-range {
            background: transparent;
            border: none;
            color: #8A8F98;
            padding: 4px 9px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-range:hover {
            color: #F3F4F6;
            background-color: #1F2128;
        }

        .btn-range.active {
            color: #FFFFFF;
            background-color: #262933;
            border: 1px solid #3B3F50;
        }

        #chart-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            height: calc(100vh - 46px);
        }

        /* Floating Multi-Series Legend */
        #legend-overlay {
            position: absolute;
            top: 10px;
            left: 12px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background-color: rgba(15, 16, 18, 0.85);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #232530;
            backdrop-filter: blur(4px);
        }

        .legend-date {
            color: #8A8F98;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-family: "JetBrains Mono", "Consolas", monospace;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .legend-name {
            color: #8A8F98;
            min-width: 170px;
        }

        .legend-val {
            color: #F3F4F6;
            font-weight: 700;
        }

        /* Loading Animation Overlay */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 16, 18, 0.88);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 50;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(94, 106, 210, 0.2);
            border-top-color: #5E6AD2;
            border-radius: 50%;
            animation: spin 0.75s cubic-bezier(0.4, 0.1, 0.4, 1) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.8px;
            color: #8A8F98;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <span class="title-badge" id="chart-title">COMPARATIVE EQUITY CURVES</span>
        <div class="button-group">
            <button class="btn-range" onclick="setTimeRange('1M', this)">1M</button>
            <button class="btn-range" onclick="setTimeRange('3M', this)">3M</button>
            <button class="btn-range" onclick="setTimeRange('6M', this)">6M</button>
            <button class="btn-range" onclick="setTimeRange('YTD', this)">YTD</button>
            <button class="btn-range" onclick="setTimeRange('1Y', this)">1Y</button>
            <button class="btn-range active" onclick="setTimeRange('ALL', this)">ALL</button>
        </div>
    </div>

    <div id="chart-container">
        <!-- Loading Animation Overlay -->
        <div id="loading-overlay" class="loading-overlay">
            <div class="spinner"></div>
            <div class="loading-text" id="loading-msg">SIMULATING ALL 5 STRATEGIES...</div>
        </div>

        <div id="legend-overlay">
            <span class="legend-date" id="legend-date">—</span>
            <div id="legend-items"></div>
        </div>
    </div>

    <script>
        let chart = null;
        let lineSeriesMap = {};
        let rawData = null;
        let currentCurrency = "$";

        const container = document.getElementById('chart-container');
        const legendDate = document.getElementById('legend-date');
        const legendItems = document.getElementById('legend-items');

        function formatCurrency(val) {
            if (val === undefined || val === null || isNaN(val)) return '—';
            return currentCurrency + Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function initChart() {
            try {
                chart = LightweightCharts.createChart(container, {
                    autoSize: true,
                    layout: {
                        background: { color: '#0F1012' },
                        textColor: '#8A8F98',
                        fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif',
                        fontSize: 11,
                    },
                    grid: {
                        vertLines: { color: 'rgba(35, 37, 48, 0.45)' },
                        horzLines: { color: 'rgba(35, 37, 48, 0.45)' },
                    },
                    crosshair: {
                        mode: LightweightCharts.CrosshairMode.Normal,
                    },
                    rightPriceScale: {
                        borderColor: '#232530',
                        autoScale: true,
                        scaleMargins: { top: 0.12, bottom: 0.12 },
                        alignLabels: true,
                    },
                    timeScale: {
                        borderColor: '#232530',
                        timeVisible: true,
                        rightOffset: 0,
                        barSpacing: 8,
                        minBarSpacing: 0.001,
                        fixLeftEdge: true,
                        fixRightEdge: true,
                    },
                });

                chart.subscribeCrosshairMove(param => {
                    if (!param || !param.time || !param.seriesData || !rawData) {
                        updateLegendDefault();
                        return;
                    }
                    const timeStr = typeof param.time === 'string' ? param.time : `${param.time.year}-${String(param.time.month).padStart(2,'0')}-${String(param.time.day).padStart(2,'0')}`;
                    legendDate.innerText = timeStr;

                    let html = '';
                    rawData.lines.forEach(line => {
                        const s = lineSeriesMap[line.name];
                        if (s) {
                            const pt = param.seriesData.get(s);
                            const val = pt ? pt.value : '—';
                            html += `
                                <div class="legend-row">
                                    <span class="legend-dot" style="background-color: ${line.color}"></span>
                                    <span class="legend-name">${line.name}</span>
                                    <span class="legend-val">${formatCurrency(val)}</span>
                                </div>
                            `;
                        }
                    });
                    legendItems.innerHTML = html;
                });
            } catch (err) {
                console.error("Init comparison chart error:", err);
            }
        }

        function updateLegendDefault() {
            if (!rawData || !rawData.lines || rawData.lines.length === 0) return;
            const firstLine = rawData.lines[0];
            if (!firstLine.data || firstLine.data.length === 0) return;

            const lastTime = firstLine.data[firstLine.data.length - 1].time;
            legendDate.innerText = `Latest: ${lastTime}`;

            let html = '';
            rawData.lines.forEach(line => {
                const lastVal = line.data && line.data.length > 0 ? line.data[line.data.length - 1].value : '—';
                html += `
                    <div class="legend-row">
                        <span class="legend-dot" style="background-color: ${line.color}"></span>
                        <span class="legend-name">${line.name}</span>
                        <span class="legend-val">${formatCurrency(lastVal)}</span>
                    </div>
                `;
            });
            legendItems.innerHTML = html;
        }

        function setTimeRange(rangeKey, btn) {
            document.querySelectorAll('.btn-range').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            if (!rawData || !rawData.lines || rawData.lines.length === 0 || !chart) return;
            const refData = rawData.lines[0].data;
            if (!refData || refData.length === 0) return;

            if (rangeKey === 'ALL') {
                chart.timeScale().fitContent();
                return;
            }

            const latestDate = new Date(refData[refData.length - 1].time);
            let targetDate = new Date(latestDate);

            if (rangeKey === '1M') targetDate.setMonth(targetDate.getMonth() - 1);
            else if (rangeKey === '3M') targetDate.setMonth(targetDate.getMonth() - 3);
            else if (rangeKey === '6M') targetDate.setMonth(targetDate.getMonth() - 6);
            else if (rangeKey === 'YTD') targetDate = new Date(latestDate.getFullYear(), 0, 1);
            else if (rangeKey === '1Y') targetDate.setFullYear(targetDate.getFullYear() - 1);

            let startIdx = 0;
            for (let i = 0; i < refData.length; i++) {
                if (new Date(refData[i].time) >= targetDate) {
                    startIdx = i;
                    break;
                }
            }

            chart.timeScale().setVisibleLogicalRange({
                from: startIdx,
                to: refData.length - 1
            });
        }

        window.updateComparisonChart = function(data) {
            try {
                if (typeof data === 'string') {
                    data = JSON.parse(data);
                }
                rawData = data;
                if (data.currency) {
                    currentCurrency = data.currency;
                }
                if (data.ticker) {
                    document.getElementById('chart-title').innerText = `${data.ticker} — ALL STRATEGIES OVERLAY`;
                }

                if (!chart) initChart();

                // Remove existing series
                for (let k in lineSeriesMap) {
                    try { chart.removeSeries(lineSeriesMap[k]); } catch (e) {}
                }
                lineSeriesMap = {};

                // Add series for each strategy line
                data.lines.forEach(line => {
                    const isBenchmark = line.name.includes("Lump Sum");
                    const s = chart.addSeries(LightweightCharts.LineSeries, {
                        color: line.color,
                        lineWidth: isBenchmark ? 1.5 : 2.5,
                        lineStyle: isBenchmark ? LightweightCharts.LineStyle.Dashed : LightweightCharts.LineStyle.Solid,
                        priceFormat: {
                            type: 'custom',
                            formatter: price => formatCurrency(price)
                        }
                    });
                    s.setData(line.data);
                    lineSeriesMap[line.name] = s;
                });

                chart.timeScale().fitContent();
                updateLegendDefault();
                hideLoading();
            } catch (err) {
                console.error("updateComparisonChart error:", err);
                hideLoading();
            }
        };

        window.showLoading = function(msg) {
            const el = document.getElementById('loading-overlay');
            if (el) {
                if (msg) document.getElementById('loading-msg').innerText = msg;
                el.classList.remove('hidden');
            }
        };

        window.hideLoading = function() {
            const el = document.getElementById('loading-overlay');
            if (el) el.classList.add('hidden');
        };

        window.addEventListener('DOMContentLoaded', () => {
            initChart();
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (chart && container) {
                    chart.applyOptions({
                        width: container.clientWidth,
                        height: container.clientHeight
                    });
                }
            }, 50);
        });
    </script>
</body>
</html>
